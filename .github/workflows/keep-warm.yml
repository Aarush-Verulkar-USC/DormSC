name: Keep API warm

# Render's free tier spins an instance down after ~15 minutes idle, and the cold
# start costs ~22s on the next request. Ping it more often than that window.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --max-time 60 \
            -o /dev/null -w 'status=%{http_code} total=%{time_total}s\n' \
            https://dormsc.onrender.com/api/health
